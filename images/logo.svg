      <stop offset="0%" stop-color="#F5A21B"/>
      <stop offset="45%" stop-color="#4CAF3E"/>
      <stop offset="100%" stop-color="#1466B8"/>
    </linearGradient>
    <linearGradient id="zoeZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A21B"/>
      <stop offset="55%" stop-color="#1466B8"/>
